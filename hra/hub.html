<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeZak Exchange · Hra</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tk{position:relative;padding:18px 20px;border-radius:18px;background:linear-gradient(160deg,#ffffff16,#ffffff08);border:1px solid #ffffff18;border-top:6px solid var(--c);box-shadow:0 10px 30px #0006}
.tk .sy{font:800 40px/1 Jost,Montserrat,system-ui,sans-serif;letter-spacing:.06em;color:var(--teal)}.tk .nm{font-size:14px;color:var(--mut);margin-top:2px}
.tk .px{font:800 54px/1.05 Jost,Montserrat,system-ui,sans-serif;margin-top:6px}.tk .px small{font-size:18px;color:var(--mut);font-weight:600}
.tk .ch{font:700 18px Jost,Montserrat,sans-serif}.tk svg{width:100%;height:56px;margin-top:6px}.tk .ed{position:absolute;top:12px;right:14px;background:#ffffff14;border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
.tk .rk{position:absolute;top:14px;right:70px;font:800 14px Jost;color:var(--gold);letter-spacing:.1em}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.tiles,.cols{grid-template-columns:1fr}}
details.dr{border-top:1px solid #ffffff18;padding:8px 0}details.dr summary{cursor:pointer;font-weight:600}
.opts div{padding:8px 12px;border-radius:10px;background:#ffffff0a;margin:6px 0}
.tm{border-left:6px solid var(--c)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit{display:none;margin-top:10px}.ta{min-height:110px;font:12px/1.4 monospace}.neg{border-left:6px solid var(--gold)}.neg table{width:100%;font-size:13px}.neg td,.neg th{padding:4px 6px;border-bottom:1px solid #ffffff18;text-align:left}.edit.on{display:block}

.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.mi{position:relative;text-align:left;padding:12px 14px 12px 54px;border-radius:14px;border:2px solid #ffffff18;background:#ffffff0c;color:#fff;cursor:pointer;display:grid;gap:2px;font:inherit}.mi .n{position:absolute;left:12px;top:8px;font:800 34px Jost,Montserrat,sans-serif;color:var(--gold)}.mi .t{font:700 15px Jost,Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.04em}.mi .k{font-size:12px;color:var(--mut)}.mi .pill{justify-self:start;margin-top:4px}.mi.on{border-color:var(--teal);background:#6bc5d51c}.mi.s-open{box-shadow:0 0 0 2px var(--ok) inset}
.tctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}.tctl .btn{padding:7px 12px}.launch{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin:6px 0 12px}.btn.go{font-size:18px;padding:14px 30px;background:linear-gradient(135deg,#4fd18b,#2fae6e);color:#04281a}
@media(max-width:1000px){.menu{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div>
<script src="qr.js"></script><script src="config.js"></script><script src="common.js"></script>
<script>
let A=null,ver=null,base='',sel=+localStorage.getItem('bx_sel')||1,gOpen=false,editing=null,shown={},impText='',msg='';
const STX={locked:'čeká',open:'otevřeno',closed:'uzavřeno',evaluated:'vyhodnoceno',published:'na burze'};
async function load(){
 if(!RUN){location.href='center.html';return}
 if(gate())return; if(!base)base=await joinBase();
 const j=await aapi('/admin/state',{since:ver,norounds:A?1:0});
 if(j.__code===401){badKey();return} if(j.__code===404){location.href='center.html';return}
 if(j.unchanged||j.error)return; if(A&&!j.rounds)j.rounds=A.rounds; ver=j.ver;A=j;render()}
const reload=()=>{ver=null;return load()};
function spark(h,c){const n=h.length,v=h.map(x=>x.bzk),mn=Math.min(...v,95),mx=Math.max(...v,105),W=300,H=56;const X=i=>n>1?4+i/(n-1)*(W-8):W/2,Y=x=>H-6-(x-mn)/(mx-mn)*(H-12);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="3" points="${h.map((x,i)=>X(i)+','+Y(x.bzk)).join(' ')}"/>${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.bzk)}" r="3.5" fill="${c}"/>`).join('')}</svg>`}
function tile(t,rank){const T=A.teams[t],h=T.history,d=h.length>1?(T.bzk/h[h.length-2].bzk-1)*100:0,c=COL[t];
 return `<div class="tk" style="--c:${c}"><span class="rk">#${rank}</span><button class="ed" onclick="editing=editing==='${t}'?null:'${t}';render()">upravit</button>
 <div class="sy">${esc(T.ticker||t)}</div><div class="nm">${esc(T.name)} · tým ${t}</div>
 <div class="px" data-t="${t}">${T.bzk.toFixed(2)} <small>BZK</small></div>
 <div class="ch ${d>=0?'ok':'bad'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)} % <span class="muted small">od minulého kola</span></div>${spark(h,c)}
 <div class="edit ${editing===t?'on':''}"><div class="mini"><div><label>Název firmy</label><input data-keep="1" id="n_${t}" value="${esc(T.name)}"></div><div><label>Zkratka (2-5 znaků)</label><input data-keep="1" id="k_${t}" maxlength="5" value="${esc(T.ticker||t)}" style="text-transform:uppercase"></div></div><label>Složka týmu na Drive (odkaz pro nahrávání)</label><input data-keep="1" id="f_${t}" value="${esc(T.folder||'')}" placeholder="https://drive.google.com/drive/folders/..."><p><button class="btn" onclick="saveTeam('${t}')">Uložit</button></p></div></div>`}
function negPanel(R,oc,roles){const n=R.negotiation,I=n.issues;
 const row=(i,k)=>{const tm=oc.deal?oc.terms[k]:null;return `<tr><td>${esc(i.label)}</td><td>${tm==null?'<span class="muted">bez dohody</span>':esc(i.levels[tm].label)}</td></tr>`};
 return `<div class="card neg"><h3 style="margin-top:0">Vyjednávání v tomto kole</h3><p><b>${n.pair[0]}</b> (firma A) a <b>${n.pair[1]}</b> (firma B) vyjednávají, <b>${n.observer}</b> pozoruje. Hranice odchodu bez dohody: ${n.bat} bodů ze 100.</p>
 <p>${oc.deal?`<span class="ok"><b>Platná dohoda.</b></span> Hodnota A ${oc.pa}, hodnota B ${oc.pb}, součet ${oc.joint} z možných ${oc.maxJoint}.`:`<span class="bad"><b>Dohoda zatím neplatí.</b></span> ${esc(oc.reason)}`}</p>
 <table><tr><th>Téma</th><th>Dohodnuté podmínky</th></tr>${I.map(row).join('')}</table>
 ${(!oc.deal&&oc.termsA)?`<p class="small bad">Zadáno ${n.pair[0]}: ${oc.termsA.map((v,k)=>esc(I[k].levels[v].label)).join(' | ')}<br>Zadáno ${n.pair[1]}: ${oc.termsB.map((v,k)=>esc(I[k].levels[v].label)).join(' | ')}</p>`:''}</div>`}
function notes(R){
 if(R.kind==='negotiation'){const n=R.negotiation;return `<p class="small"><b>Firma A (${n.pair[0]}), ${esc(n.roles.A.summary)}:</b> ${esc(n.roles.A.brief)}</p><p class="small"><b>Firma B (${n.pair[1]}), ${esc(n.roles.B.summary)}:</b> ${esc(n.roles.B.brief)}</p><p class="small"><b>Pozorovatel (${n.observer}):</b> ${esc(n.roles.OBS.brief)}</p><p class="small"><b>Co sledovat:</b> ${n.roles.OBS.watch.map(esc).join(' · ')}</p><p class="small"><b>Správná odpověď pro hodnocení pozorovatele:</b> ${esc(n.observerJudge)}</p>${R.avatars.map(x=>`<p class="small"><b>${esc(x.name)}:</b> ${esc(x.persona)}</p>`).join('')}<table class="small"><tr><th>Scénář</th><th>Dohoda (A)</th><th>Bez dohody (C)</th></tr>${R.scenarios.map(s=>`<tr><td>${s.id}: ${esc(s.headline)}</td><td>${s.effects.A>0?'+':''}${s.effects.A} %</td><td>${s.effects.C>0?'+':''}${s.effects.C} %</td></tr>`).join('')}</table><p class="small muted">Pozorovatel dostává dopad podle své volby A, B, C. Vyjednávající firmy podle toho, zda dohoda platí.</p>`}
 return `${R.avatars.map(x=>`<p class="small"><b>${esc(x.name)}:</b> ${esc(x.persona)}</p>`).join('')}<table class="small"><tr><th>Scénář</th>${R.decision.options.map(o=>`<th>${o.id}</th>`).join('')}</tr>${R.scenarios.map(s=>`<tr><td>${s.id}: ${esc(s.headline)}</td>${R.decision.options.map(o=>`<td>${s.effects[o.id]>0?'+':''}${s.effects[o.id]} %</td>`).join('')}</tr>`).join('')}</table>`}
function teamCard(R,t,roles,oc){
 const neg=R.kind==='negotiation',role=neg?roles[t]:null,subs=A.subs[sel]||{},s=subs[t]||{decision:{},live:[null,null,null],ai:null,result:null,terms:null},sc=(A.scoreView[sel]||{})[t]||{decision:0,ai:0,live:0,total:0},ai=s.ai,T=A.teams[t];
 const lv=role==='OBS'?R.negotiation.observerLive:R.live,isNeg=role==='A'||role==='B';
 const opt=!isNeg&&R.decision?R.decision.options.find(o=>o.id===(s.decision||{}).option):null;
 const roleTxt=!neg?'':role==='OBS'?'pozorovatel':'vyjednavač '+role;
 return `<div class="card tm" style="--c:${COL[t]}"><h3 style="margin:0">${esc(T.ticker||t)} · ${esc(T.name)} <span class="muted small">${roleTxt}</span></h3>
 <p class="small">${s.submittedAt?`<span class="ok">Odevzdáno ${new Date(s.submittedAt).toLocaleTimeString()}</span>`:'<span class="bad">Zatím neodevzdáno</span>'} · ${T.folder?`<a href="${esc(T.folder)}" target="_blank" rel="noopener">složka týmu na Drive</a>`:'<span class="bad">odkaz na složku není zadán</span>'}</p>
 ${isNeg?`<p class="small"><b>Zadané podmínky:</b> ${s.terms?R.negotiation.issues.map((i,k)=>esc(i.levels[s.terms[k]].label)).join(' | '):'žádné'}</p>`:`<p><b>Volba: ${opt?opt.id+'. '+esc(opt.label):'žádná'}</b></p><p class="small">${esc((s.decision||{}).rationale)}</p>`}
 ${s.artifact?`<p class="small" style="white-space:pre-wrap"><b>Poznámka týmu:</b> ${esc(s.artifact)}</p>`:''}
 <h3>Hodnocení z výstupů ${ai&&ai.imported?'<span class="muted small">(importováno)</span>':''}</h3>${ai?`<p class="small"><b>Rozhodnutí:</b> ${esc(ai.decision.comment)} <i>${esc(ai.decision.evidence)}</i></p><p class="small"><b>Vedení AI:</b> ${esc(ai.ai.comment)} <i>${esc(ai.ai.evidence)}</i></p>${ai.feedback?`<p class="small muted">${esc(ai.feedback)}</p>`:''}${(ai.flags||[]).length?`<p class="small bad">Upozornění: ${esc(ai.flags.join('; '))}</p>`:''}`:'<p class="muted small">Zatím neimportováno.</p>'}
 <div class="mini"><div><label>Rozhodnutí /30 ${isNeg?'(automaticky z dohody, přepiš jen výjimečně)':''}</label><input data-keep="1" type="number" min="0" max="30" step="0.5" value="${(s.scores&&s.scores.dm)||!isNeg?(sc.decision!=null?sc.decision:''):''}" placeholder="${isNeg?sc.decision:''}" onchange="setScore('${t}',{decision:this.value})"></div><div><label>Vedení AI /20</label><input data-keep="1" type="number" min="0" max="20" step="0.5" value="${(s.scores&&s.scores.ai!=null)?s.scores.ai:(ai?ai.ai.score:'')}" onchange="setScore('${t}',{ai:this.value})"></div></div>
 <h3 style="margin-top:12px">Živé vystoupení (1-5) <span class="muted small">${esc(lv.title)}</span></h3><p class="small muted" style="margin:6px 0">${lv.criteria.map(esc).join(' · ')}</p><div class="score">${[1,2,3,4,5].map(v=>`<button class="${(s.live[0]===v&&s.live[1]===v&&s.live[2]===v)?'on':''}" onclick="setLiveAll('${t}',${v})">${v}</button>`).join('')}</div>
 <p style="margin-top:12px"><b>Celkem ${sc.total} / 100</b> <span class="muted small">(${sc.decision} + ${sc.ai} + ${sc.live}${sc.liveMissing?' <span class=bad>chybí živé hodnocení</span>':''})</span></p>
 ${s.result?`<p class="ok"><b>Zveřejněno:</b> ${s.result.perf>0?'+':''}${s.result.perf} % výkon, ${s.result.consequence>0?'+':''}${s.result.consequence} % trh = ${s.result.delta>0?'+':''}${s.result.delta} % → ${s.result.after} BZK</p>`:''}</div>`}
function render(){
 const a=document.activeElement; if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.dataset.keep)return;
 const R=A.rounds.find(r=>r.id===sel),st=A.status[sel],neg=R.kind==='negotiation',roles=A.roles[sel]||{},oc=A.outcome[sel];
 const rank=Object.fromEntries([...TEAMS].sort((x,y)=>A.teams[y].bzk-A.teams[x].bzk).map((t,i)=>[t,i+1]));
 let h=`<div class="top"><b>BeZak Exchange</b><span class="muted small">${esc(A.name)} · <b style="letter-spacing:.14em">${esc(A.code)}</b></span><span class="sp"></span><a href="center.html?key=${encodeURIComponent(ADMIN)}">Řídicí centrum</a><a href="welcome.html?run=${RUN}" target="_blank">Uvítací obrazovka</a><a href="board.html?run=${RUN}" target="_blank">Burza</a><a href="cards.html?run=${RUN}&key=${encodeURIComponent(ADMIN)}" target="_blank">Přístupové karty</a><a href="#" onclick="exportRun();return false">Export</a></div><div class="wrap" style="max-width:1400px">
 <div class="tiles" style="margin-top:6px">${TEAMS.map(t=>tile(t,rank[t])).join('')}</div>
 <div class="card" style="padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="width:58px;height:58px;background:#fff;border-radius:8px;padding:3px">${qr(base)}</div><div><div class="muted small">TÝMY SE HLÁSÍ NA</div><b>${esc(shortUrl(base))}</b></div>${TEAMS.map(t=>`<span class="pill team-${t}">${t} ${esc(A.teams[t].access)}</span>`).join('')}<span class="sp"></span><button class="btn alt" style="padding:7px 14px" onclick="toggleCodes()">${A.showCodes?'Skrýt kódy na uvítací obrazovce':'Zobrazit kódy na uvítací obrazovce'}</button></div>
 <h3 style="margin:16px 0 6px">Menu kol</h3>
 <div class="menu">${A.rounds.map(r=>`<button class="mi ${r.id===sel?'on':''} s-${A.status[r.id]}" onclick="sel=${r.id};localStorage.setItem('bx_sel',sel);render()"><span class="n">${r.id}</span><span class="t">${esc(r.title)}</span><span class="k">${esc(r.skill)}</span><span class="pill ${A.status[r.id]}">${STX[A.status[r.id]]}</span></button>`).join('')}</div>
 <div class="cols"><div>
 <div class="card paper"><div class="muted small" style="font-family:Jost;text-transform:uppercase;letter-spacing:.2em;text-align:center;color:#555">The BeZak Morning Herald</div><div class="hl">${esc(R.newspaper.headline)}</div><p>${esc(R.newspaper.lead)}</p></div>
 <div class="card"><h2>Kolo ${R.id}: ${esc(R.title)}</h2><div class="muted small" style="margin-bottom:8px">${esc(R.day)} · ${esc(R.skill)}${neg?' · vyjednávací kolo':''}</div><p>${esc(R.brief)}</p>
 ${neg?`<h3>Vyjednávané téma</h3><ul class="small">${R.negotiation.issues.map(i=>`<li>${esc(i.label)}: ${i.levels.map(l=>esc(l.label)).join(' / ')}</li>`).join('')}</ul>`:`<h3>Rozhodnutí</h3><p><b>${esc(R.decision.question)}</b></p><div class="opts">${R.decision.options.map(o=>`<div><b>${o.id}. ${esc(o.label)}</b><br><span class="small muted">${esc(o.desc||'')}</span></div>`).join('')}</div>`}
 <h3 style="margin-top:14px">Požadovaný výstup</h3><p class="small">${esc(R.artifact.prompt)}</p>${neg?`<p class="small"><b>Pozorovatel:</b> ${esc(R.negotiation.observerArtifact)}</p>`:''}
 <h3>Živé vystoupení</h3><p class="small"><b>${esc(R.live.title)}.</b> ${esc(R.live.instructions)}</p><ul class="small">${R.live.criteria.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${neg?`<p class="small"><b>Pozorovatel: ${esc(R.negotiation.observerLive.title)}</b></p><ul class="small">${R.negotiation.observerLive.criteria.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
 <details class="dr"><summary>Datová místnost</summary>${(R.dataRoom||[]).map(d=>`<p class="small"><b>${esc(d.title)}</b><br>${esc(d.text)}</p>`).join('')}</details>
 <details class="dr" id="guide" ${gOpen?'open':''} ontoggle="gOpen=this.open"><summary>Poznámky facilitátora (N): skryté informace a důsledky</summary>${notes(R)}</details></div></div>
 <div><div class="card"><h2>Kolo ${R.id}: ${esc(R.title)}</h2><div class="launch"><div><label style="margin:0">Čas na práci (min)</label><input data-keep="1" id="mins" type="number" min="0" max="240" value="${R.minutes}" style="width:110px"></div><button class="btn go" ${st==='open'?'disabled':''} onclick="act('open')">${st==='open'?'Kolo běží':'Spustit kolo '+R.id}</button></div><div class="tctl"><span class="muted small">ČASOMÍRA</span>${A.timer?`<span class="timer"><span data-end="${A.timer.endsAt}" data-left="${A.timer.paused?A.timer.left:''}"></span></span>${A.timer.paused?'<span class="muted small">pozastaveno</span>':''}`:'<span class="muted small">neběží</span>'}<button class="btn alt" onclick="tm('add',-5)">−5</button><button class="btn alt" onclick="tm('add',-1)">−1</button><button class="btn alt" onclick="tm('add',1)">+1</button><button class="btn alt" onclick="tm('add',5)">+5</button><button class="btn alt" onclick="tm('start',+($('#mins').value||5))">${A.timer&&A.timer.paused?'Pokračovat':'Start'}</button><button class="btn alt" onclick="tm('pause',0)">Pauza</button><button class="btn alt" onclick="tm('clear',0)">Reset</button></div>
 <p><a class="btn" style="text-decoration:none;display:inline-block" href="stage.html?run=${RUN}&key=${encodeURIComponent(ADMIN)}&r=${sel}" target="_blank">Promítat kolo ${R.id} (prezentační režim)</a> <a class="btn alt" style="text-decoration:none;display:inline-block" href="stage.html?run=${RUN}" target="_blank">Okno pro projektor</a></p>
 <p><button class="btn alt" onclick="act('close')">2. Uzavřít odevzdání</button></p>
 <h3>3. Hodnocení výstupů</h3><p class="small muted">Po uzavření odevzdání zkopíruj větu a vlož ji do chatu s Claude. Claude přečte složky týmů na Drive a uloží hodnocení. Pak klikni na Načíst.</p>
 <p><button class="btn gold" onclick="copySentence()">Zkopírovat větu pro Claude</button> <span class="small ok" id="pm">${esc(msg)}</span></p>
 <p class="small muted" style="margin:2px 0 10px">Zkopíruje se věta s celým pokynem pro Claude (kolo ${sel}, běh ${esc(RUN)}).</p>
 <p><button class="btn" onclick="loadEval()">Načíst hodnocení z Drive</button></p>
 <details style="margin:8px 0" ${manualOpen?'open':''} ontoggle="manualOpen=this.open"><summary class="small muted" style="cursor:pointer">Ruční postup (záložní)</summary>
 <p><button class="btn alt" onclick="copyPack()">Zkopírovat zadání pro hodnocení</button></p>
 <textarea class="ta" data-keep="1" id="imp" placeholder="Sem vlož JSON od Claude" oninput="impText=this.value">${esc(impText)}</textarea>
 <p><button class="btn alt" onclick="doImport()">Importovat hodnocení</button></p></details>
 <p><select data-keep="1" id="scn" style="width:auto;display:inline-block"><option value="random">Scénář: náhodný</option>${R.scenarios.map(s=>`<option value="${s.id}" ${A.scenario[sel]===s.id?'selected':''}>${s.id}: ${esc(s.headline)}</option>`).join('')}</select> <button class="btn red" onclick="publish()">4. Zveřejnit na burze</button></p></div>
 ${neg&&oc?negPanel(R,oc,roles):''}
 ${TEAMS.map(t=>teamCard(R,t,roles,oc)).join('')}
 <p class="small"><button class="btn alt" onclick="resetRun()">Resetovat tento běh (vygeneruje nové PINy)</button></p></div></div></div>`;
 $('#app').innerHTML=h;clock();
 document.querySelectorAll('.px').forEach(e=>{const t=e.dataset.t,to=A.teams[t].bzk,from=shown[t]??to;shown[t]=to;if(from!==to){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1200);e.firstChild.textContent=(from+(to-from)*k).toFixed(2)+' ';if(k<1)requestAnimationFrame(f)})(t0)}})}
async function saveTeam(t){await aapi('/admin/team',{team:t,name:$('#n_'+t).value,ticker:$('#k_'+t).value,folder:$('#f_'+t).value});editing=null;await reload()}
async function act(a){if(a==='open'&&Object.entries(A.status).some(([i,s])=>s==='open'&&+i!==sel)&&!confirm('Jiné kolo právě běží. Uzavřít ho a spustit kolo '+sel+'?'))return;await aapi('/admin/round',{round:sel,action:a,minutes:+(($('#mins')||{}).value||0)});reload()}
async function tm(op,m){await aapi('/admin/timer',{op,minutes:m});reload()}
async function toggleCodes(){await aapi('/admin/run/meta',{showCodes:!A.showCodes});reload()}
async function publish(){if(!confirm('Zveřejnit kolo '+sel+' a přepočítat BZK?'))return;await aapi('/admin/publish',{round:sel,scenario:$('#scn').value});reload()}
async function setScore(team,o){await aapi('/admin/score',Object.assign({round:sel,team},o));reload()}
async function setLive(team,i,v){const s=(A.subs[sel]||{})[team];const live=(s&&s.live||[null,null,null]).slice();live[i]=v;await aapi('/admin/score',{round:sel,team,live});reload()}
async function setLiveAll(team,v){await aapi('/admin/score',{round:sel,team,live:[v,v,v]});reload()}
async function copyPack(){const j=await aapi('/admin/evalpack',{round:sel});if(!j.text){msg='Chyba: '+(j.error||'');render();return}
 try{await navigator.clipboard.writeText(j.text)}catch(e){const t=document.createElement('textarea');t.value=j.text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
 const e=$('#pm');if(e)e.textContent='Zkopírováno ('+j.text.length+' znaků). Vlož do Claude.';}
let manualOpen=false;
async function copySentence(){const t='Vyhodnoť kolo '+sel+' běhu '+RUN+' hry BeZak Exchange. Na Google Drive najdi soubor K'+sel+'_ZADANI_PRO_HODNOCENI.txt (složka běhu '+RUN+' v 05_HRA/UCASTNICKE_ADRESARE), přečti ho a postupuj přesně podle něj: přečti soubory K'+sel+'_ ve složkách týmů, ohodnoť je a výsledek ulož do složky běhu jako K'+sel+'_HODNOCENI.json.';try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}const e=$('#pm');if(e)e.textContent='Zkopírováno. Vlož do chatu s Claude.'}
async function loadEval(){const j=await aapi('/admin/loadeval',{round:sel});if(j.error){alert((j.error==='unknown'||j.error==='not found')?'Tato funkce běží jen na hostingu (Google). Použij ruční postup.':j.error);return}alert('Hodnocení načteno pro: '+(j.teams||[]).join(', '));reload()}
async function doImport(){const t=($('#imp')||{}).value||impText;if(!t.trim()){alert('Vlož JSON od Claude.');return}const j=await aapi('/admin/import',{round:sel,data:t});if(j.error){alert(j.error);return}impText='';alert('Importováno pro: '+j.teams.join(', '));reload()}
async function exportRun(){const j=await aapi('/admin/export');const b=new Blob([JSON.stringify(j.run,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bezak-'+RUN+'-export.json';a.click()}
async function resetRun(){if(prompt('Napiš RESET pro smazání celé hry')==='RESET'){await aapi('/admin/reset',{confirm:'RESET'});location.reload()}}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||!A)return;const t=e.target&&e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(t))return;const k=e.key;
 if(k==='ArrowRight'){sel=Math.min(A.rounds.length,sel+1);localStorage.setItem('bx_sel',sel);render()}else if(k==='ArrowLeft'){sel=Math.max(1,sel-1);localStorage.setItem('bx_sel',sel);render()}
 else if(k==='ArrowUp'){e.preventDefault();tm('add',e.shiftKey?5:1)}else if(k==='ArrowDown'){e.preventDefault();tm('add',e.shiftKey?-5:-1)}
 else if(k.toLowerCase()==='n'){gOpen=!gOpen;render()}});
legend('← → kolo · ↑ ↓ časomíra · N poznámky · B burza · F celá obrazovka');
poll(load,3500);
</script></body></html>
