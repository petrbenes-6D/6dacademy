<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeZak Exchange · Stage</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{height:100%;overflow:hidden}.st{position:fixed;inset:0;display:flex;flex-direction:column}
.sbar{flex:none;display:flex;align-items:center;gap:16px;padding:12px 28px;background:#fff;color:#1a1342;border-bottom:4px solid var(--teal)}.sbar img{height:40px}.sbar b{font:800 15px Jost,Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-left:2px solid #e3e0f2;padding-left:16px}.sbar .sp{flex:1}
.tm{font:800 34px Jost,Montserrat,sans-serif;background:var(--gold);color:#321;border-radius:99px;padding:2px 22px;min-width:130px;text-align:center}.tm.late{background:var(--coral);color:#fff}.tm.off{display:none}
.sl{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3vh 7vw;overflow:hidden}
.k{font:700 clamp(13px,1.5vw,20px) Jost,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--teal);margin-bottom:1.2vh}
.h1{font:800 clamp(40px,7.4vw,120px)/1.02 Jost,Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.02em}.h2{font:800 clamp(30px,4.6vw,74px)/1.08 Jost,Montserrat,sans-serif;text-transform:uppercase}
.p{font-size:clamp(18px,2.3vw,36px);line-height:1.5;max-width:1500px;color:#ece8ff}.sk{font:700 clamp(18px,2.4vw,38px) Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2vh}
.paper{background:#f1ead8;color:#1b1b1b;border-radius:18px;padding:4vh 4vw;font-family:Georgia,serif;box-shadow:0 20px 60px #000a}.paper small{font:700 clamp(12px,1.3vw,18px) Jost;letter-spacing:.3em;text-transform:uppercase;color:#777;display:block;text-align:center;border-bottom:3px solid #222;padding-bottom:1vh;margin-bottom:2vh}.paper .hl{font:800 clamp(34px,5.6vw,90px)/1.04 Jost,Montserrat,sans-serif;text-transform:uppercase}.paper p{font-size:clamp(18px,2.2vw,34px);margin:1.5vh 0 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw}.g.c3{grid-template-columns:repeat(3,1fr)}.cd{background:linear-gradient(160deg,#ffffff1a,#ffffff08);border:1px solid #ffffff22;border-radius:18px;padding:2.2vh 1.8vw}.cd b{display:block;font:800 clamp(18px,2.1vw,32px) Jost,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--teal);margin-bottom:.6vh}.cd span{font-size:clamp(14px,1.55vw,24px);line-height:1.45}
.op b{color:#fff}.op .l{font:800 clamp(40px,5vw,80px)/1 Jost;color:var(--gold)}
.dots{flex:none;display:flex;gap:8px;justify-content:center;padding:8px}.dots i{width:34px;height:5px;border-radius:3px;background:#ffffff26}.dots i.on{background:var(--teal)}
.notes{position:fixed;left:0;right:0;bottom:0;max-height:48vh;overflow:auto;background:#fff;color:#1a1342;border-top:6px solid var(--pu,#412D87);padding:16px 28px 22px;display:none;z-index:30;box-shadow:0 -10px 40px #000a}.notes.on{display:block}.notes h4{margin:0 0 6px;font:800 13px Jost;letter-spacing:.2em;text-transform:uppercase;color:#412D87}.notes p,.notes li{font-size:16px;line-height:1.5}.notes table{font-size:14px}.notes th{color:#412D87}
.pt{flex:none;display:flex;gap:10px;align-items:center;padding:6px 28px;background:#0b0724;font-size:13px;color:#b9b2e0;flex-wrap:wrap}.pt .btn{padding:5px 12px;font-size:12px}.pt input{width:70px;padding:5px}
#bd{position:fixed;inset:0;z-index:40;background:#0e0a2b;display:none}#bd.on{display:block}#bd iframe{width:100%;height:100%;border:0}
</style></head><body><div class="st" id="st"></div><div class="notes" id="nt"></div><div id="bd"><iframe id="bf"></iframe></div>
<script src="config.js"></script><script src="common.js"></script><script>
window.BX_OWN_B=true;
const PRES=!!QS.get('key');let X=null,A=null,notes=false,applyingLocal=false;
const api=(p,b)=>bx(p,Object.assign({k:ADMIN,run:RUN},b));
function slides(r){
 const neg=r.kind==='negotiation';
 const S=[
 {k:'Round '+r.id,h:`<div class="k">Future Human Leader · BeZak Exchange</div><div class="k" style="color:var(--gold)">Round ${r.id}</div><div class="h1">${esc(r.title)}</div><div class="sk">${esc(r.skill)}</div>`,
  n:`<h4>Dovednost kola</h4><p>${esc(r.skill)}. Živé vystoupení: <b>${esc(r.live.title)}</b>. Kritéria, na která dáváš známky: ${r.live.criteria.map(esc).join('; ')}.</p><p>Uveď kolo jednou větou, nečti zadání. Doporučeno 1 min.</p>`},
 {h:`<div class="k">Today in the news</div><div class="paper"><small>The BeZak Morning Herald</small><div class="hl">${esc(r.newspaper.headline)}</div><p>${esc(r.newspaper.lead)}</p></div>`,
  n:`<h4>Noviny</h4><p>Přečti titulek nahlas a nech 15 sekund ticha. Ptej se týmů: kdo je v tomto příběhu v ohrožení a kdo vydělá?</p>`},
 {h:`<div class="k">Your brief</div><div class="p">${esc(r.brief)}</div>`,
  n:`<h4>Zadání</h4><p>Zeptej se, co není jasné. Připomeň: týmy používají vlastní AI a musí ji vést. Postavy (avatary) si založí vložením připraveného textu do své AI.</p>`},
 {h:`<div class="k">Data room (in your app too)</div><div class="g">${r.dataRoom.map(d=>`<div class="cd"><b>${esc(d.title)}</b><span>${esc(d.text)}</span></div>`).join('')}</div>`,
  n:`<h4>Datová místnost</h4><p>Čísla mají týmy v aplikaci. Ne vše je v datech: kdo si ověří, co chybí, získá body za vedení AI.</p>`}];
 if(neg){const p=r.neg.pair,o=r.neg.observer;S.push({h:`<div class="k">Table rules</div><div class="h2" style="margin-bottom:3vh">${esc(p[0].ticker)} vs ${esc(p[1].ticker)}</div><div class="g"><div class="cd"><b>Negotiators</b><span>${esc(p[0].name)} and ${esc(p[1].name)} negotiate face to face. Each has a confidential brief in the app.</span></div><div class="cd"><b>Observer</b><span>${esc(o.name)} watches in silence, takes notes and presents a 2-minute report afterwards.</span></div></div><div class="p" style="margin-top:3vh;font-size:clamp(16px,1.9vw,28px)">Issues: ${r.neg.issues.map(esc).join(' · ')}</div><div class="p" style="font-size:clamp(16px,1.9vw,28px)">One agreement, identical terms from both firms, or no deal.</div>`,
  n:A&&A.negotiation?`<h4>Tajná zadání (nikdo je nesmí vidět)</h4><p><b>${esc(A.negotiation.pair[0])}, firma A:</b> ${esc(A.negotiation.roles.A.summary)}. ${esc(A.negotiation.roles.A.brief)}</p><p><b>${esc(A.negotiation.pair[1])}, firma B:</b> ${esc(A.negotiation.roles.B.summary)}. ${esc(A.negotiation.roles.B.brief)}</p><p><b>Co sledovat:</b> ${A.negotiation.roles.OBS.watch.map(esc).join(' · ')}</p><p>Dopad scénářů: dohoda = sloupec A, bez dohody = sloupec C.</p>`:''})}
 else S.push({h:`<div class="k">Your decision</div><div class="h2" style="margin-bottom:3vh">${esc(r.decision.question)}</div><div class="g c3 op">${r.decision.options.map(o=>`<div class="cd"><div class="l">${o.id}</div><b>${esc(o.label)}</b><span>${esc(o.desc)}</span></div>`).join('')}</div>`,
  n:A?`<h4>Dopad scénářů na BZK (skryté)</h4><table><tr><th>Scénář</th>${r.decision.options.map(o=>`<th>${o.id}</th>`).join('')}</tr>${(A.scenarios||[]).map(s=>`<tr><td>${esc(s.id)}: ${esc(s.headline)}</td>${r.decision.options.map(o=>`<td>${s.effects[o.id]>0?'+':''}${s.effects[o.id]} %</td>`).join('')}</tr>`).join('')}</table><p>Žádná volba není správná. Hodnotí se zdůvodnění a práce s AI.</p>`:''});
 S.push({h:`<div class="k">Required output</div><div class="p">${esc(r.artifact.prompt)}</div>${neg?`<div class="p" style="margin-top:2vh;color:var(--teal)">Observer: ${esc(r.artifact.observer)}</div>`:''}<div class="p" style="margin-top:2vh;font-size:clamp(16px,1.8vw,26px);color:var(--gold)">Upload your files to your team folder. Name them K${r.id}_...</div>`,
  n:A?`<h4>Podle čeho hodnotí Claude: rozhodnutí (z 30)</h4><p>${esc(A.judge.decision)}</p><h4>Podle čeho hodnotí Claude: vedení AI (z 20)</h4><p>${esc(A.judge.ai)}</p>`:''});
 S.push({h:`<div class="k">Live performance</div><div class="h2">${esc(r.live.title)}</div><div class="p" style="margin:2vh 0">${esc(r.live.instructions)}</div><div class="g c3">${r.live.criteria.map((c,i)=>`<div class="cd"><b>${i+1}</b><span>${esc(c)}</span></div>`).join('')}</div>`,
  n:A?`<h4>Postavy pro týmy (jejich texty jsou v aplikaci týmů)</h4><ul>${A.avatars.map(a=>`<li><b>${esc(a.name)}.</b> ${esc(a.persona)}</li>`).join('')}</ul><p>Po každém vystoupení zadej 3 známky 1 až 5 v hlavní stránce.</p>`:''});
 return S}
function render(){
 if(!X)return;const r=X.round;let h=`<div class="sbar"><img src="logo.png" alt=""><b>BeZak Exchange</b><span class="muted small" style="color:#6a6490">${esc(X.run.name)}</span><span class="sp"></span><span class="tm off" id="tm"></span></div>`;
 if(!r){h+=`<div class="sl" style="align-items:center;text-align:center"><div class="k">Future Human Leader</div><div class="h1">BeZak <span style="color:var(--teal)">Exchange</span></div><div class="sk">Aquatech LAB Game</div></div>`}
 else{const S=slides(r),i=Math.min(X.stage.step,S.length-1);h+=`<div class="sl">${S[i].h}</div><div class="dots">${S.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>`;
  const nt=$('#nt');nt.innerHTML=(S[i].n||'<p class="muted">Bez poznámek.</p>');nt.classList.toggle('on',PRES&&notes)}
 if(PRES)h+=`<div class="pt"><span>Prezentační režim (publikum nevidí tuto lištu ani poznámky)</span><span class="sp" style="flex:1"></span>Časomíra: <input id="mn" type="number" value="10" min="1"> min <button class="btn" onclick="tstart()">Start</button><button class="btn alt" onclick="tadd(-5)">−5</button><button class="btn alt" onclick="tadd(-1)">−1</button><button class="btn alt" onclick="tadd(1)">+1</button><button class="btn alt" onclick="tadd(5)">+5</button><button class="btn alt" onclick="tclear()">Stop</button></div>`;
 $('#st').innerHTML=h;
 const bd=$('#bd');bd.classList.toggle('on',!!X.stage.board);if(X.stage.board&&!$('#bf').src)$('#bf').src=`board.html?run=${RUN}&embed=1`;if(!X.stage.board)$('#bf').removeAttribute('src');
 tick()}
function tick(){const e=$('#tm');if(!e)return;if(!X||!X.timer){e.classList.add('off');return}const v=X.timer.endsAt-Date.now();e.classList.remove('off');e.classList.toggle('late',v<=0);e.textContent=v>0?mmss(v):'00:00'}
setInterval(tick,400);
let pend=0,ver=null;async function load(){const n=await bx('/stage',{run:RUN,since:ver});if(n.unchanged||n.error)return;if(PRES&&pend>0&&X)n.stage=X.stage;ver=n.ver;X=n;render()}
async function setStage(o){if(!PRES)return;Object.assign(X.stage,o);render();pend++;try{await api('/admin/stage',o)}finally{pend--}if(o.round!=null){ver=null;await load()}}
const tstart=()=>api('/admin/timer',{op:'start',minutes:+$('#mn').value||5}),tadd=m=>api('/admin/timer',{op:'add',minutes:m}),tclear=()=>api('/admin/timer',{op:'clear'});
document.addEventListener('keydown',e=>{if(!PRES||!X)return;const t=e.target&&e.target.tagName;if(['INPUT','TEXTAREA'].includes(t))return;if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key,L=X.round?slides(X.round).length:0,s=X.stage.step;
 if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();if(X.round)setStage({step:Math.min(L-1,s+1)})}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(X.round)setStage({step:Math.max(0,s-1)})}
 else if(k==='Home')setStage({step:0});else if(k==='End')setStage({step:L-1});
 else if(k==='ArrowUp'){e.preventDefault();tadd(e.shiftKey?5:1)}else if(k==='ArrowDown'){e.preventDefault();tadd(e.shiftKey?-5:-1)}
 else if(k.toLowerCase()==='b'){setStage({board:!X.stage.board})}
 else if(k.toLowerCase()==='n'){notes=!notes;render()}
 else if(/^[1-8]$/.test(k)){setStage({round:+k,step:0,board:false})}
 else if(k==='Escape'&&X.stage.board)setStage({board:false})});
(async()=>{if(PRES){if(gate())return;const st=await bx('/admin/state',{k:ADMIN,run:RUN});if(st.__code===401){badKey();return}if(st.rounds){window.AS=st;window.__R=st.rounds}}
 await load();if(PRES&&QS.get('r')&&(!X.stage.round||+QS.get('r')!==X.stage.round))await setStage({round:+QS.get('r'),step:0,board:false});
 poll(load,2500);
 legend(PRES?'← → posun · ↑ ↓ časomíra · B burza · N poznámky · F celá obrazovka · 1–8 kolo':'F celá obrazovka')})();
// poznámky potřebují data kola z admin stavu
const _render=render;render=function(){A=null;if(PRES&&window.__R&&X&&X.round)A=window.__R.find(x=>x.id===X.round.id)||null;_render()};
</script></body></html>
