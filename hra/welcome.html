<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeZak Exchange · Welcome</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>.join{display:flex;gap:4vw;align-items:center;justify-content:center;margin:3vh auto 0;flex-wrap:wrap}.join svg.big{width:clamp(180px,22vw,320px);height:auto;background:#fff;border-radius:18px;padding:10px;box-shadow:0 14px 40px #0008}.join .t{text-align:left}.url{font:800 clamp(26px,3.6vw,48px) Jost,Montserrat,sans-serif;color:var(--teal);letter-spacing:.03em;word-break:break-all}.ac{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1300px;margin:30px auto}.a{padding:22px;border-radius:22px;background:linear-gradient(160deg,#ffffff18,#ffffff08);border:1px solid #ffffff1c;border-top:10px solid var(--c);text-align:center;box-shadow:0 14px 40px #0008}.a .tm{font:800 22px Jost,Montserrat,sans-serif;letter-spacing:.3em;color:var(--c)}.a .cd{font:800 52px/1 Jost,Montserrat,sans-serif;letter-spacing:.12em;margin:14px 0 6px}.a svg{width:130px;height:130px;background:#fff;border-radius:12px;padding:6px;margin-top:10px}.hid{opacity:.45;font:700 26px Jost;letter-spacing:.2em;padding:50px 0}@media(max-width:900px){.ac{grid-template-columns:1fr}.join .t{text-align:center}}</style></head>
<body><div class="hero" style="padding-top:4vh"><div class="plate"><img src="logo.png" alt=""></div><div class="eyebrow">Future Human Leader</div><h1 style="font-size:clamp(40px,6.4vw,84px)">BeZak <span>Exchange</span></h1><div class="sub" id="rn"></div>
<div class="join"><div id="jq"></div><div class="t"><div class="muted" style="font-size:clamp(16px,1.8vw,24px)">Scan the code or open this address,<br>then enter your access code</div><div class="url" id="url" style="margin-top:1vh"></div></div></div></div>
<div class="ac" id="ac"></div><script src="qr.js"></script><script src="config.js"></script><script src="common.js"></script><script>
let ver=null,base='';
async function load(){if(!base){base=await joinBase();$('#jq').innerHTML=qr(base).replace('<svg','<svg class="big"');$('#url').textContent=shortUrl(base)}
 const W=await bx('/welcome',{run:RUN,since:ver});if(W.unchanged)return;if(W.error){$('#ac').innerHTML='<p class="muted" style="grid-column:1/-1;text-align:center">Run not found.</p>';return}ver=W.ver;
 $('#rn').textContent=W.run.name;
 $('#ac').innerHTML=W.teams.map(t=>`<div class="a" style="--c:${COL[t.team]}"><div class="tm">${t.team}</div>${t.access?`<div class="cd">${esc(t.access)}</div><div class="muted small">${esc(t.ticker)} · ${esc(t.name)}</div>${qr(base+'?c='+t.access)}`:`<div class="hid">ACCESS CODE<br>IS ABOUT TO APPEAR</div>`}</div>`).join('')}
poll(load,5000);
</script></body></html>
