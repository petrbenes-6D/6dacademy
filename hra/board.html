<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeZak Stock Exchange</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>body{overflow:hidden}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.tile{padding:22px;border-radius:18px;background:var(--panel)}.tile .nm{font:700 26px Jost,Montserrat,system-ui,sans-serif;text-transform:uppercase}.tile .v{font:800 84px/1 Jost,Montserrat,system-ui,sans-serif;margin:10px 0}.tile .d{font:700 22px Jost,Montserrat,system-ui,sans-serif}.hist svg{width:100%;height:340px;background:var(--panel);border-radius:18px}.news{background:#f1ead8;color:#1b1b1b;border-radius:14px;padding:18px 26px;font-family:Georgia,serif}.news b{font:800 34px/1.1 Jost,Montserrat,system-ui,sans-serif;text-transform:uppercase;display:block}.tick{white-space:nowrap;overflow:hidden;color:var(--gold);font:700 20px Jost,Montserrat,system-ui,sans-serif;padding:10px 0}</style></head>
<body><div class="top"><b style="font-size:24px">BeZak Stock Exchange</b><span class="muted small" id="rn"></span><span class="pill" id="rd"></span><span class="timer" id="tm" style="display:none"></span><span class="sp"></span><span class="muted" id="sk"></span></div>
<div class="wrap" style="max-width:1500px"><div class="row" id="tiles"></div><div class="grid g2" style="margin-top:22px;grid-template-columns:1.4fr 1fr"><div class="hist" id="chart"></div><div class="news" id="news"></div></div><div class="tick" id="tick"></div></div>
<script>window.BX_IS_BOARD=true</script><script src="config.js"></script><script src="common.js"></script>
<script>
let END=0;setInterval(()=>{const e=document.getElementById('tm');if(!e)return;const v=END-Date.now();e.style.display=END?'inline-block':'none';e.textContent=v>0?String(Math.floor(v/60000)).padStart(2,'0')+':'+String(Math.floor(v/1000)%60).padStart(2,'0'):'00:00'},500);
let ver=null;async function draw(){const b=await bx('/board',{run:RUN,since:ver});if(b.unchanged||b.error)return;ver=b.ver;
 const sorted=[...b.teams].sort((a,b)=>b.bzk-a.bzk);
 document.getElementById('tiles').innerHTML=sorted.map((t,i)=>{const h=t.history,d=h.length>1?(t.bzk/h[h.length-2].bzk-1)*100:0;return `<div class="tile team-${t.team}"><div class="nm" style="display:flex;align-items:center;gap:12px"><span style="font-size:40px;color:var(--teal)">${esc(t.ticker)}</span><span style="font-size:20px;color:var(--mut)">${esc(t.name)}</span></div><div class="v">${t.bzk.toFixed(2)} <span style="font-size:24px;color:var(--mut)">BZK</span></div><div class="d ${d>=0?'ok':'bad'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</div></div>`}).join('');
 const W=900,H=340,P=40,n=Math.max(...b.teams.map(t=>t.history.length)),all=b.teams.flatMap(t=>t.history.map(h=>h.bzk)),mn=Math.min(...all,90),mx=Math.max(...all,110);
 const X=i=>P+(n>1?i/(n-1):0)*(W-2*P),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
 document.getElementById('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${[0,.25,.5,.75,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff1a"/><text x="6" y="${Y(v)+4}" fill="#b9b2e0" font-size="12">${v.toFixed(0)}</text>`}).join('')}${b.teams.map(t=>`<polyline fill="none" stroke="${COL[t.team]}" stroke-width="4" points="${t.history.map((h,i)=>X(i)+','+Y(h.bzk)).join(' ')}"/>${t.history.map((h,i)=>`<circle cx="${X(i)}" cy="${Y(h.bzk)}" r="5" fill="${COL[t.team]}"/>`).join('')}`).join('')}${Array.from({length:n},(_,i)=>`<text x="${X(i)}" y="${H-12}" fill="#b9b2e0" font-size="12" text-anchor="middle">R${i}</text>`).join('')}</svg>`;
 const c=b.current; document.getElementById('rd').textContent=c?`Round ${c.id} · ${c.title}`:''; document.getElementById('sk').textContent=c?c.skill:'';document.getElementById('rn').textContent=b.run.name;END=c&&c.endsAt?c.endsAt:0;document.title='BeZak Exchange · '+b.run.name;
 const last=b.published.at(-1);
 document.getElementById('news').style.display=c?'block':'none';document.getElementById('news').innerHTML=c?`<div class="muted small" style="font-family:Jost;text-transform:uppercase">The BeZak Morning Herald</div><b>${esc(c.status==='published'&&last?last.headline:c.newspaper.headline)}</b><p>${esc(c.status==='published'?'Round '+c.id+' is closed. Results are on the board.':c.newspaper.lead)}</p>`:'';
 document.getElementById('tick').textContent=b.published.map(p=>`R${p.id} ${p.title}: ${p.headline}`).join('   ·   ')}
if(QS.get('embed')==='1')document.querySelector('.top').style.display='none';poll(draw,4000);
</script></body></html>
