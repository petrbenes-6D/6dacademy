<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeZak Exchange · Access cards</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>body{background:#fff;color:#1a1342}.bar{padding:14px 24px;background:#1a1342;color:#fff;display:flex;gap:14px;align-items:center}.bar .btn{padding:8px 16px}.sheet{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:24px;max-width:1000px;margin:0 auto}.c{border:2px solid #1a1342;border-radius:16px;overflow:hidden;page-break-inside:avoid;break-inside:avoid}.c .t{background:var(--c);color:#fff;padding:10px 18px;font:800 20px Jost,Montserrat,sans-serif;letter-spacing:.3em;display:flex;justify-content:space-between;align-items:center}.c .t img{height:30px;background:#fff;border-radius:6px;padding:3px 6px}.c .b{padding:16px 18px;text-align:center}.c .cd{font:800 44px/1 Jost,Montserrat,sans-serif;letter-spacing:.1em}.c svg{width:130px;height:130px;margin:8px 0}.c p{margin:4px 0;font-size:13px;color:#555}.c b{color:#412D87}@media print{.bar{display:none}.sheet{padding:0;gap:12px}}</style></head>
<body><div class="bar"><b id="ti"></b><span style="flex:1"></span><button class="btn" onclick="print()">Vytisknout</button></div><div class="sheet" id="s"></div>
<script src="qr.js"></script><script src="config.js"></script><script src="common.js"></script><script>
(async()=>{if(gate())return;const A=await aapi('/admin/state',{norounds:1});if(A.__code===401){badKey();return}if(A.error){$('#s').innerHTML='<p>Běh nenalezen.</p>';return}$('#ti').textContent='Přístupové karty · běh '+A.name+' ('+A.code+')';const url=await joinBase();
 $('#s').innerHTML=TEAMS.flatMap(t=>[0,1].map(()=>`<div class="c" style="--c:${COL[t]}"><div class="t"><span>${t}</span><img src="logo.png" alt=""></div><div class="b"><div class="muted" style="font:700 12px Jost;letter-spacing:.2em;color:#777">YOUR ACCESS CODE</div><div class="cd">${esc(A.teams[t].access)}</div>${qr(url+'?c='+A.teams[t].access)}<p>Scan the code, or open <b>${esc(shortUrl(url))}</b> and type it in.</p><p>BeZak Exchange · Aquatech LAB Game</p></div></div>`)).join('')})();
</script></body></html>
